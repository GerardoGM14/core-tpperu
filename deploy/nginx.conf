# ============================================================
# TPP Perú · Nginx (reverse proxy + estáticos)
#   /        -> landing (Astro, estático)
#   /app     -> frontend panel ops (Vite SPA)
#   /api     -> API NestJS (proxy interno)
#   /socket.io -> WebSocket de la API
# wa-daemon NO se expone (solo lo consume la API por red interna).
# ============================================================
server {
    listen 80;
    server_name _;

    client_max_body_size 32m;

    # ---- API (NestJS) ----
    location /api/ {
        proxy_pass http://api:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- Health de la API ----
    location = /health {
        proxy_pass http://api:4000/health;
    }

    # ---- WebSocket (socket.io) ----
    location /socket.io/ {
        proxy_pass http://api:4000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
    }

    # ---- Frontend (panel ops, Vite SPA) en /app ----
    location /app/ {
        alias /usr/share/nginx/html/frontend/;
        try_files $uri $uri/ /app/index.html;
    }

    # ---- Landing (Astro) en raíz ----
    location / {
        root /usr/share/nginx/html/landing;
        try_files $uri $uri/ /index.html;
    }
}
