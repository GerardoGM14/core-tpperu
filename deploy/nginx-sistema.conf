# ============================================================
# TPP Perú · Nginx del SISTEMA (VPS con juego Steam)
# Va en /etc/nginx/sites-available/tpp  (enlazado a sites-enabled)
#   /        -> landing (Astro, estático en disco)
#   /app     -> frontend panel ops (Vite SPA)
#   /api     -> API NestJS en 127.0.0.1:4000
#   /socket.io -> WebSocket de la API
# NO toca el servidor de Steam (puerto 27015).
# ============================================================
server {
    listen 80;
    listen [::]:80;
    server_name 161.132.37.155;

    client_max_body_size 32m;

    # Estáticos servidos desde disco
    root /var/www/tpp;

    # ---- API (NestJS) ----
    location /api/ {
        proxy_pass http://127.0.0.1:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://127.0.0.1:4000/health;
    }

    # ---- WebSocket (socket.io) ----
    location /socket.io/ {
        proxy_pass http://127.0.0.1:4000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
    }

    # ---- Frontend (panel ops, Vite SPA) en /app ----
    location /app/ {
        alias /var/www/tpp/frontend/;
        try_files $uri $uri/ /app/index.html;
    }

    # ---- Landing (Astro) en raíz ----
    location / {
        root /var/www/tpp/landing;
        try_files $uri $uri/ /index.html;
    }
}
