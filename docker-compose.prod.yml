# ============================================================
# TPP Perú · Producción
# Postgres y Redis NO exponen puertos al host (solo red interna).
# Solo Nginx (80) queda público; API y wa-daemon son internos.
# ============================================================
name: tpp-prod

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - tpp_postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 512M

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - tpp_redis_data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 256M

  api:
    build:
      context: ./backend/api
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: ./.env.prod
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 600M

  wa-daemon:
    build:
      context: ./backend/wa-daemon
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: ./.env.prod
    environment:
      # El wa-daemon comparte .env.prod con la API (PORT=4000 es de la API).
      # Aquí forzamos su propio puerto para que coincida con el healthcheck.
      PORT: "8080"
      # El driver pq (Go) NO entiende ?schema=public (eso es de Prisma).
      # Le damos la URL sin ese parámetro, solo con sslmode=disable.
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 256M

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/www/frontend:/usr/share/nginx/html/frontend:ro
      - ./deploy/www/landing:/usr/share/nginx/html/landing:ro
    depends_on:
      - api
    networks:
      - internal
    deploy:
      resources:
        limits:
          memory: 128M

volumes:
  tpp_postgres_data:
  tpp_redis_data:

networks:
  internal:
    driver: bridge
